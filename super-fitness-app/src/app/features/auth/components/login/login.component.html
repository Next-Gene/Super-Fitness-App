<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-dark-900 via-dark-800 to-primary-900/30 dark:from-dark-900 dark:via-dark-800 dark:to-primary-900/30 relative overflow-hidden">
  <!-- Animated Background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-500/20 rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-accent-500/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 1s;"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-fitness-green/10 rounded-full blur-3xl animate-glow"></div>
  </div>

  <div class="w-full max-w-md px-4 py-8 relative z-10">
    <div class="card p-8 animate-slide-up">
      <!-- Logo Section -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-500 to-fitness-green mb-4 shadow-lg shadow-primary-500/30">
          <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gradient">{{ translation.t('app.title') }}</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2">{{ translation.t('app.subtitle') }}</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email -->
        <div class="space-y-2">
          <label for="email" class="text-sm font-medium text-gray-700 dark:text-gray-300">{{ translation.t('auth.email') }}</label>
          <div class="relative">
            <input type="email" id="email" formControlName="email" 
              class="input-field pr-12" 
              [class.border-red-500]="f['email'].touched && f['email'].invalid"
              [placeholder]="translation.t('auth.email')">
            <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
            </svg>
          </div>
          <p *ngIf="f['email'].touched && f['email'].errors?.['required']" class="text-red-500 text-xs">Email is required</p>
          <p *ngIf="f['email'].touched && f['email'].errors?.['email']" class="text-red-500 text-xs">Please enter a valid email</p>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label for="password" class="text-sm font-medium text-gray-700 dark:text-gray-300">{{ translation.t('auth.password') }}</label>
          <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'" id="password" formControlName="password" 
              class="input-field pr-12" 
              [class.border-red-500]="f['password'].touched && f['password'].invalid"
              [placeholder]="translation.t('auth.password')">
            <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2">
              <svg *ngIf="!showPassword()" class="w-5 h-5 text-gray-400 hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg *ngIf="showPassword()" class="w-5 h-5 text-gray-400 hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
              </svg>
            </button>
          </div>
          <p *ngIf="f['password'].touched && f['password'].errors?.['required']" class="text-red-500 text-xs">Password is required</p>
          <p *ngIf="f['password'].touched && f['password'].errors?.['minlength']" class="text-red-500 text-xs">Password must be at least 6 characters</p>
        </div>

        <!-- Error Message -->
        <div *ngIf="error()" class="p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
          <p class="text-red-600 dark:text-red-400 text-sm">{{ error() }}</p>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="isLoading()" 
          class="btn-primary w-full flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg *ngIf="isLoading()" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ isLoading() ? translation.t('common.loading') : translation.t('auth.loginButton') }}</span>
        </button>
      </form>

      <!-- Register Link -->
      <p class="mt-6 text-center text-gray-600 dark:text-gray-400">
        {{ translation.t('auth.noAccount') }}
        <a routerLink="/auth/register" class="text-primary-500 hover:text-primary-600 font-medium">{{ translation.t('auth.register') }}</a>
      </p>
    </div>
  </div>
</div>
