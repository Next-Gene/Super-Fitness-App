<div class="page-container">
  <div class="page-background">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
  </div>

  <div class="page-content">
    <!-- Profile Header -->
    <div class="profile-header">
      <div class="profile-avatar-section">
        <div class="avatar-container">
          <div class="avatar" [style.background-image]="getAvatarUrl()">
            <span *ngIf="!getAvatarUrl()">{{ getInitials() }}</span>
          </div>
          <label class="avatar-upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden>
          </label>
        </div>
        <div class="profile-info">
          <h1>{{ user()?.firstName }} {{ user()?.lastName }}</h1>
          <p>{{ user()?.email }}</p>
          <span class="role-badge" *ngIf="userRoles.length > 0">{{ userRoles[0] }}</span>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="profile-tabs">
      <button [class.active]="activeTab() === 'profile'" (click)="activeTab.set('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </button>
      <button [class.active]="activeTab() === 'password'" (click)="activeTab.set('password')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Password
      </button>
    </div>

    <!-- Profile Tab -->
    <div *ngIf="activeTab() === 'profile'" class="tab-content">
      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="profile-form">
        <div class="form-section">
          <h3>Personal Information</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" formControlName="firstName" placeholder="First Name">
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" formControlName="lastName" placeholder="Last Name">
            </div>
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" formControlName="phoneNumber" placeholder="Phone Number">
          </div>
        </div>

        <div class="form-section">
          <h3>Fitness Goals</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>Goal</label>
              <select formControlName="goal">
                <option value="">Select Goal</option>
                <option value="LoseWeight">Lose Weight</option>
                <option value="GainWeight">Gain Weight</option>
                <option value="GetFitter">Get Fitter</option>
                <option value="BuildMuscle">Build Muscle</option>
                <option value="MaintainWeight">Maintain Weight</option>
              </select>
            </div>
            <div class="form-group">
              <label>Activity Level</label>
              <select formControlName="activtyLevel">
                <option value="">Select Level</option>
                <option value="Sedentary">Sedentary</option>
                <option value="Light">Light</option>
                <option value="Moderate">Moderate</option>
                <option value="Active">Active</option>
                <option value="VeryActive">Very Active</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Weight (kg)</label>
              <input type="number" formControlName="weight" placeholder="Weight">
            </div>
            <div class="form-group">
              <label>Height (cm)</label>
              <input type="number" formControlName="height" placeholder="Height">
            </div>
          </div>
        </div>

        <div *ngIf="error()" class="error-message">{{ error() }}</div>
        <div *ngIf="successMessage()" class="success-message">{{ successMessage() }}</div>

        <button type="submit" [disabled]="isLoading()" class="save-btn">
          {{ isLoading() ? 'Saving...' : 'Save Changes' }}
        </button>
      </form>
    </div>

    <!-- Password Tab -->
    <div *ngIf="activeTab() === 'password'" class="tab-content">
      <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="password-form">
        <div class="form-section">
          <h3>Change Password</h3>
          
          <div class="form-group">
            <label>Current Password</label>
            <div class="password-input">
              <input [type]="showCurrentPassword() ? 'text' : 'password'" formControlName="currentPassword" placeholder="Current Password">
              <button type="button" class="toggle-password" (click)="showCurrentPassword.set(!showCurrentPassword())">
                <svg *ngIf="!showCurrentPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showCurrentPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>New Password</label>
            <div class="password-input">
              <input [type]="showNewPassword() ? 'text' : 'password'" formControlName="newPassword" placeholder="New Password">
              <button type="button" class="toggle-password" (click)="showNewPassword.set(!showNewPassword())">
                <svg *ngIf="!showNewPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showNewPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm New Password</label>
            <div class="password-input">
              <input [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Confirm New Password">
              <button type="button" class="toggle-password" (click)="showConfirmPassword.set(!showConfirmPassword())">
                <svg *ngIf="!showConfirmPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showConfirmPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="passwordError()" class="error-message">{{ passwordError() }}</div>
        <div *ngIf="passwordSuccess()" class="success-message">{{ passwordSuccess() }}</div>

        <button type="submit" [disabled]="isPasswordLoading() || passwordForm.invalid" class="save-btn">
          {{ isPasswordLoading() ? 'Changing...' : 'Change Password' }}
        </button>
      </form>
    </div>
  </div>
</div>
