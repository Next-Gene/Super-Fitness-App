<div class="login-container">
  <!-- Animated Background -->
  <div class="login-background">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
  </div>

  <div class="login-card card-premium">
    <!-- Logo Section -->
    <div class="logo-section">
      <app-logo [size]="88" class="mx-auto block mb-4"></app-logo>
      <h1 class="logo-title">SuperFitness</h1>
      <p class="logo-subtitle">Your fitness journey starts here</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" formControlName="email" 
            class="form-input input-standard" 
            [class.input-error]="f['email'].touched && f['email'].invalid"
            placeholder="Enter your email">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
          </svg>
        </div>
        <p *ngIf="f['email'].touched && f['email'].errors?.['required']" class="error-text">Email is required</p>
        <p *ngIf="f['email'].touched && f['email'].errors?.['email']" class="error-text">Please enter a valid email</p>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'" id="password" formControlName="password" 
            class="form-input input-standard" 
            [class.input-error]="f['password'].touched && f['password'].invalid"
            placeholder="Enter your password">
          <button type="button" (click)="togglePassword()" class="toggle-password" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPassword()" class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <svg *ngIf="showPassword()" class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
            </svg>
          </button>
        </div>
        <p *ngIf="f['password'].touched && f['password'].errors?.['required']" class="error-text">Password is required</p>
        <p *ngIf="f['password'].touched && f['password'].errors?.['minlength']" class="error-text">Password must be at least 6 characters</p>
      </div>

      <!-- Error Message -->
      <div *ngIf="error()" class="error-message">
        <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        {{ error() }}
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="isLoading()" class="btn-submit btn-primary">
        <svg *ngIf="isLoading()" class="btn-spinner" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ isLoading() ? 'Loading...' : 'Sign In' }}</span>
      </button>
    </form>

    <!-- Register Link -->
    <p class="register-link">
      Don't have an account?
      <a routerLink="/auth/register" class="register-link-text">Register</a>
    </p>
  </div>
</div>
